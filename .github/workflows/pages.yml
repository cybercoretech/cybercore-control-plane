name: Deploy Control Plane (Cloudflare + GitHub mirror)

# cybercore-control-plane.pages.dev is the primary site. GitHub Pages is an
# exact mirror: both receive the same _site bundle from the same commit, and
# GitHub Pages only deploys after Cloudflare succeeds, so the mirror can never
# run ahead of (or diverge from) the primary.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Bundle site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble _site (repo minus git/CI metadata)
        run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/
          find _site -type f | sort | xargs sha1sum > "$RUNNER_TEMP/manifest.txt"
          echo "Bundled $(wc -l < "$RUNNER_TEMP/manifest.txt") files"
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          include-hidden-files: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  cloudflare:
    name: Deploy primary (Cloudflare Pages)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages
      url: https://cybercore-control-plane.pages.dev/
    steps:
      - name: Require Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in Settings > Secrets and variables > Actions. The GitHub mirror is held back until Cloudflare deploys."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.151.2"
          command: pages deploy _site --project-name=cybercore-control-plane --branch=main --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  github-mirror:
    name: Deploy mirror (GitHub Pages)
    needs: cloudflare
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
